[package]
name = "codex-pet-island"
version = "0.1.11"
description = "A transparent Codex pet island for Windows"
authors = ["Codex"]
edition = "2021"

[lib]
name = "codex_pet_island"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-positioner = { version = "=2.3.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-store = "=2.4.4"
